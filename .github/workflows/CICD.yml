name: CICD

# spell-checker:ignore CICD MSVC MacOS SHAs buildable gnueabihf musl popd pushd softprops toolchain riscv

env:
  PROJECT_NAME: dust
  PROJECT_DESC: "du + rust = dust"
  PROJECT_AUTH: "bootandy"

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Style
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install wget for Windows (required by typos-action)
        if: matrix.os == 'windows-latest'
        run: choco install wget --no-progress
      - name: typos-action
        uses: crate-ci/typos@v1.28.4
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        if: success() || failure() # run regardless of fmt outcome
        run: cargo clippy --locked -- -D warnings

  build:
    name: Build
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # { os, target, cargo-options, features, use-cross, toolchain }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, use-cross: use-cross }
          - { os: ubuntu-24.04-riscv, target: riscv64gc-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, use-cross: use-cross }
          - { os: ubuntu-latest, target: arm-unknown-linux-gnueabihf, use-cross: use-cross }
          - { os: ubuntu-latest, target: arm-unknown-linux-musleabi, use-cross: use-cross }
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu, use-cross: use-cross }
          - { os: ubuntu-latest, target: i686-unknown-linux-musl, use-cross: use-cross }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, use-cross: use-cross }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, use-cross: use-cross }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: i686-pc-windows-gnu }
          - { os: windows-latest, target: i686-pc-windows-msvc }
          - { os: windows-latest, target: x86_64-pc-windows-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Install any prerequisites
        shell: bash
        run: |
          case ${{ matrix.job.target }} in
            arm-unknown-linux-gnueabihf) sudo apt-get -y update ; sudo apt-get -y install gcc-arm-linux-gnueabihf ;;
            aarch64-unknown-linux-gnu) sudo apt-get -y update ; sudo apt-get -y install binutils-aarch64-linux-gnu ;;
          esac

      - name: Initialize workflow variables
        id: vars
        shell: bash
        run: |
          # toolchain: gnu targets on Windows need the matching -pc-windows-gnu toolchain
          TOOLCHAIN="stable"
          case ${{ matrix.job.target }} in *-pc-windows-gnu) TOOLCHAIN="stable-${{ matrix.job.target }}" ;; esac
          [ -n "${{ matrix.job.toolchain }}" ] && TOOLCHAIN="${{ matrix.job.toolchain }}"

          # exe suffix
          EXE_suffix="" ; case ${{ matrix.job.target }} in *-pc-windows-*) EXE_suffix=".exe" ;; esac

          # package name
          REF_TAG=""   ; case ${GITHUB_REF} in refs/tags/*) REF_TAG=${GITHUB_REF#refs/tags/} ;; esac
          REF_SHAS=${GITHUB_SHA:0:8}
          PKG_suffix=".tar.gz" ; case ${{ matrix.job.target }} in *-pc-windows-*) PKG_suffix=".zip" ;; esac
          PKG_BASENAME=${PROJECT_NAME}-${REF_TAG:-$REF_SHAS}-${{ matrix.job.target }}
          PKG_NAME=${PKG_BASENAME}${PKG_suffix}

          # deployable tag? (ie, leading "vM" or "M"; M == version number)
          DEPLOY="" ; [[ $REF_TAG =~ ^[vV]?[0-9].* ]] && DEPLOY='true'

          # target-specific cargo options
          CARGO_FEATURES_OPTION=""
          [ -n "${{ matrix.job.features }}" ] && CARGO_FEATURES_OPTION='--features "${{ matrix.job.features }}"'

          CARGO_USE_CROSS="true"
          case '${{ matrix.job.use-cross }}' in ''|0|f|false|n|no) CARGO_USE_CROSS="" ;; esac

          # Cross-compiled Linux arm/aarch64 binaries can't be executed on the x86_64 build hosts.
          JOB_DO_TESTING="true"
          CARGO_TEST_OPTIONS=""
          case ${{ matrix.job.target }} in
            arm-unknown-linux-*|aarch64-unknown-linux-*) JOB_DO_TESTING="" ; CARGO_TEST_OPTIONS="--bin ${PROJECT_NAME}" ;;
          esac

          # strip executable?
          STRIP="strip"
          case ${{ matrix.job.target }} in
            arm-unknown-linux-gnueabihf) STRIP="arm-linux-gnueabihf-strip" ;;
            aarch64-unknown-linux-gnu) STRIP="aarch64-linux-gnu-strip" ;;
            *-pc-windows-msvc|aarch64-unknown-linux-musl|arm-unknown-linux-musleabi) STRIP="" ;;
          esac

          {
            echo "TOOLCHAIN=${TOOLCHAIN}"
            echo "STAGING=_staging"
            echo "EXE_suffix=${EXE_suffix}"
            echo "PKG_BASENAME=${PKG_BASENAME}"
            echo "PKG_NAME=${PKG_NAME}"
            echo "DEPLOY=${DEPLOY}"
            echo "CARGO_FEATURES_OPTION=${CARGO_FEATURES_OPTION}"
            echo "CARGO_USE_CROSS=${CARGO_USE_CROSS}"
            echo "JOB_DO_TESTING=${JOB_DO_TESTING}"
            echo "CARGO_TEST_OPTIONS=${CARGO_TEST_OPTIONS}"
            echo "STRIP=${STRIP}"
          } >> "$GITHUB_OUTPUT"

      - name: Create all needed build/work directories
        shell: bash
        run: mkdir -p '${{ steps.vars.outputs.STAGING }}/${{ steps.vars.outputs.PKG_BASENAME }}'

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.vars.outputs.TOOLCHAIN }}
          targets: ${{ matrix.job.target }}

      - name: Install cross (if needed)
        if: steps.vars.outputs.CARGO_USE_CROSS
        shell: bash
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Info
        shell: bash
        run: |
          gcc --version || true
          rustup -V
          rustup show
          cargo -V
          rustc -V

      - name: Build
        shell: bash
        run: |
          RUNNER=cargo
          [ -n "${{ steps.vars.outputs.CARGO_USE_CROSS }}" ] && RUNNER=cross
          $RUNNER build --locked --release --target=${{ matrix.job.target }} ${{ matrix.job.cargo-options }} ${{ steps.vars.outputs.CARGO_FEATURES_OPTION }}

      - name: Install cargo-deb
        if: matrix.job.target == 'i686-unknown-linux-musl' || matrix.job.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: cargo install cargo-deb

      - name: Build deb
        if: matrix.job.target == 'i686-unknown-linux-musl' || matrix.job.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: cargo deb --no-build --target=${{ matrix.job.target }}

      - name: Test
        if: steps.vars.outputs.JOB_DO_TESTING
        shell: bash
        run: |
          RUNNER=cargo
          [ -n "${{ steps.vars.outputs.CARGO_USE_CROSS }}" ] && RUNNER=cross
          $RUNNER test --locked --target=${{ matrix.job.target }} ${{ steps.vars.outputs.CARGO_TEST_OPTIONS }} ${{ matrix.job.cargo-options }} ${{ steps.vars.outputs.CARGO_FEATURES_OPTION }}

      - name: Archive executable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.job.target }}
          path: target/${{ matrix.job.target }}/release/${{ env.PROJECT_NAME }}${{ steps.vars.outputs.EXE_suffix }}

      - name: Archive deb artifacts
        uses: actions/upload-artifact@v4
        if: matrix.job.target == 'i686-unknown-linux-musl' || matrix.job.target == 'x86_64-unknown-linux-musl'
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.job.target }}.deb
          path: target/${{ matrix.job.target }}/debian

      - name: Package
        shell: bash
        run: |
          cp 'target/${{ matrix.job.target }}/release/${{ env.PROJECT_NAME }}${{ steps.vars.outputs.EXE_suffix }}' '${{ steps.vars.outputs.STAGING }}/${{ steps.vars.outputs.PKG_BASENAME }}/'
          if [ -n "${{ steps.vars.outputs.STRIP }}" ]; then "${{ steps.vars.outputs.STRIP }}" '${{ steps.vars.outputs.STAGING }}/${{ steps.vars.outputs.PKG_BASENAME }}/${{ env.PROJECT_NAME }}${{ steps.vars.outputs.EXE_suffix }}' ; fi
          cp README.md LICENSE '${{ steps.vars.outputs.STAGING }}/${{ steps.vars.outputs.PKG_BASENAME }}/'
          pushd '${{ steps.vars.outputs.STAGING }}/' >/dev/null
          case ${{ matrix.job.target }} in
            *-pc-windows-*) 7z -y a '${{ steps.vars.outputs.PKG_NAME }}' '${{ steps.vars.outputs.PKG_BASENAME }}'/* | tail -2 ;;
            *) tar czf '${{ steps.vars.outputs.PKG_NAME }}' '${{ steps.vars.outputs.PKG_BASENAME }}'/* ;;
          esac
          popd >/dev/null

      - name: Publish
        uses: softprops/action-gh-release@v1
        if: steps.vars.outputs.DEPLOY
        with:
          files: |
            ${{ steps.vars.outputs.STAGING }}/${{ steps.vars.outputs.PKG_NAME }}
            target/${{ matrix.job.target }}/debian/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
